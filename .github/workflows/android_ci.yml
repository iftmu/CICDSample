# .github/workflows/android_ci.yml

name: Android CI # 1. Workflow Name

on: # 2. When the workflow runs (Triggers)
  push:
    branches: [ "cicd" ]
  pull_request:
    branches: [ "cicd" ]

jobs: # 3. Define the Jobs
  build: # 4. Job ID (e.g., 'build')
    runs-on: ubuntu-latest # 5. Runner Environment

    steps: # 6. Steps within the Job
      - name: Checkout Code # 7. Step Name
        uses: actions/checkout@v4 # 8. Using a Pre-built Action

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: # 9. Inputs for the Action
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # 10. Running a Shell Command

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk